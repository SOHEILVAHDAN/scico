<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z-NOX — کاتالوگ ویدیویی فتوکاتالیست</title>
<style>
  @font-face{font-family:'Vaz';src:url('assets/fonts/Vazirmatn-Regular.woff2') format('woff2');font-weight:400;font-display:block}
  @font-face{font-family:'Vaz';src:url('assets/fonts/Vazirmatn-Medium.woff2') format('woff2');font-weight:500;font-display:block}
  @font-face{font-family:'Vaz';src:url('assets/fonts/Vazirmatn-SemiBold.woff2') format('woff2');font-weight:600;font-display:block}
  @font-face{font-family:'Vaz';src:url('assets/fonts/Vazirmatn-Bold.woff2') format('woff2');font-weight:700;font-display:block}
  @font-face{font-family:'Vaz';src:url('assets/fonts/Vazirmatn-ExtraBold.woff2') format('woff2');font-weight:800;font-display:block}
  @font-face{font-family:'Inter';src:url('assets/fonts/Inter-Regular.woff2') format('woff2');font-weight:400;font-display:block}
  @font-face{font-family:'Inter';src:url('assets/fonts/Inter-Medium.woff2') format('woff2');font-weight:500;font-display:block}
  @font-face{font-family:'Inter';src:url('assets/fonts/Inter-SemiBold.woff2') format('woff2');font-weight:600;font-display:block}
  @font-face{font-family:'Inter';src:url('assets/fonts/Inter-Bold.woff2') format('woff2');font-weight:700;font-display:block}

  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#07080b; --ink:#f2efe8; --dim:rgba(242,239,232,.58); --faint:rgba(242,239,232,.3);
    --accent:#8e7bff; --accent2:#c9bdff; --panel:rgba(242,239,232,.045); --line:rgba(242,239,232,.12);
  }
  html,body{height:100%}
  body{
    background:radial-gradient(120% 90% at 50% 0%, #14111f 0%, var(--bg) 60%);
    color:var(--ink); font-family:'Vaz',system-ui,sans-serif; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  /* ---------- stage ---------- */
  .stage{width:100vw;height:100vh;display:flex;flex-direction:column}
  .frame{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}
  canvas#film{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* vignette + letterbox feel */
  .frame::after{content:'';position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 140px rgba(0,0,0,.55)}

  /* ---------- boot ---------- */
  #boot{position:absolute;inset:0;z-index:30;background:#07080b;display:grid;place-items:center;
    transition:opacity .7s ease, visibility .7s}
  #boot.gone{opacity:0;visibility:hidden}
  .boot-in{text-align:center}
  .boot-mark{width:54px;height:54px;margin:0 auto 22px;border:1.5px solid var(--ink);border-radius:50%;
    display:grid;place-items:center;animation:bp 1.6s ease-in-out infinite}
  .boot-mark i{width:16px;height:16px;border:1.5px solid var(--accent);transform:rotate(45deg);display:block}
  .boot-t{font-family:'Inter';letter-spacing:.4em;font-weight:700;font-size:15px}
  .boot-s{font-size:12px;color:var(--faint);letter-spacing:.2em;margin-top:10px}
  .boot-bar{width:180px;height:1px;background:rgba(255,255,255,.12);margin:26px auto 0;overflow:hidden}
  .boot-bar i{display:block;height:100%;width:40%;background:var(--accent);animation:bs 1.2s ease-in-out infinite}
  @keyframes bp{0%,100%{opacity:1}50%{opacity:.45}}
  @keyframes bs{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}

  /* ---------- start overlay ---------- */
  #overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;
    background:linear-gradient(180deg,rgba(7,8,11,.55),rgba(7,8,11,.88));
    opacity:0;visibility:hidden;transition:opacity .5s, visibility .5s;backdrop-filter:blur(2px)}
  #overlay.show{opacity:1;visibility:visible}
  .ov-in{text-align:center}
  .ov-btn{
    width:104px;height:104px;border-radius:50%;border:1px solid rgba(242,239,232,.28);
    background:rgba(242,239,232,.05);color:var(--ink);cursor:pointer;display:grid;place-items:center;
    transition:transform .25s, background .25s, border-color .25s;margin:0 auto 26px
  }
  .ov-btn:hover{transform:scale(1.06);background:rgba(142,123,255,.16);border-color:rgba(142,123,255,.55)}
  .ov-btn svg{width:30px;height:30px;fill:var(--ink);margin-right:-3px}
  .ov-t{font-size:26px;font-weight:600;letter-spacing:.02em}
  .ov-s{font-size:14px;color:var(--dim);margin-top:10px;letter-spacing:.04em}
  .ov-hint{font-size:12px;color:var(--faint);margin-top:26px;letter-spacing:.08em}

  /* ---------- transport ---------- */
  .bar{
    flex:0 0 auto;background:rgba(9,10,14,.94);border-top:1px solid var(--line);
    padding:14px 26px 16px;display:flex;flex-direction:column;gap:10px;
    backdrop-filter:blur(14px)
  }
  .seek{position:relative;height:18px;cursor:pointer;display:flex;align-items:center}
  .seek-track{position:absolute;left:0;right:0;height:3px;background:rgba(242,239,232,.13);border-radius:2px;overflow:hidden}
  #seek-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px}
  #seek-knob{position:absolute;width:11px;height:11px;border-radius:50%;background:#fff;
    transform:translate(-50%,0);box-shadow:0 0 0 4px rgba(142,123,255,.28);left:0}
  .rows{display:flex;align-items:center;gap:18px;justify-content:space-between}
  .transport{display:flex;align-items:center;gap:12px}
  button.icon{background:transparent;border:1px solid var(--line);color:var(--ink);width:38px;height:38px;
    border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:.2s}
  button.icon:hover{background:rgba(242,239,232,.08);border-color:rgba(242,239,232,.3)}
  button.icon.off{opacity:.4}
  #play{width:44px;height:44px;border-color:rgba(142,123,255,.5);background:rgba(142,123,255,.14)}
  #play:hover{background:rgba(142,123,255,.3)}
  .timebox{font-family:'Inter';font-size:12.5px;color:var(--dim);letter-spacing:.08em;min-width:96px}
  .chapters{display:flex;gap:6px;flex:1 1 auto;max-width:820px;flex-wrap:wrap;justify-content:center}
  .chap{
    font-family:'Vaz';font-size:11.5px;color:var(--faint);background:transparent;border:1px solid transparent;
    border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap;transition:.2s;letter-spacing:.02em
  }
  .chap:hover{color:var(--ink);background:rgba(242,239,232,.06)}
  .chap.on{color:var(--accent2);border-color:rgba(142,123,255,.4);background:rgba(142,123,255,.12)}
  .meta{display:flex;align-items:center;gap:14px;justify-content:space-between;font-size:11.5px;color:var(--faint);letter-spacing:.06em}
  .meta b{color:var(--dim);font-weight:500}
  .kbd{font-family:'Inter';font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:2px 6px;color:var(--faint)}
  .brandline{display:flex;align-items:center;gap:10px;font-family:'Inter';font-weight:700;letter-spacing:.2em;font-size:12px}
  .brandline i{width:9px;height:9px;border:1.2px solid var(--accent);transform:rotate(45deg);display:block}

  body.export .bar,body.export #overlay,body.export #boot{display:none!important}
  body.export .frame{height:100vh}

  @media (max-width:820px){
    .chapters{display:none}
    .bar{padding:10px 14px 12px}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="frame">
    <canvas id="film" width="1920" height="1080"></canvas>

    <div id="boot">
      <div class="boot-in">
        <div class="boot-mark"><i></i></div>
        <div class="boot-t">Z-NOX</div>
        <div class="boot-s">کاتالوگ فنی · در حال آماده‌سازی</div>
        <div class="boot-bar"><i></i></div>
      </div>
    </div>

    <div id="overlay" class="show">
      <div class="ov-in">
        <button class="ov-btn" id="startBtn" aria-label="پخش">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="ov-t">کاتالوگ ویدیویی زیناکس</div>
        <div class="ov-s">نه فصل · نریشن فارسی · ۲ دقیقه و ۲۰ ثانیه</div>
        <div class="ov-hint">برای پخش صدا، هدفون یا بلندگو را روشن کنید</div>
      </div>
    </div>
  </div>

  <div class="bar">
    <div class="seek" id="seek">
      <div class="seek-track"><div id="seek-fill"></div></div>
      <div id="seek-knob"></div>
    </div>

    <div class="rows">
      <div class="transport">
        <button class="icon" id="play" data-state="play" aria-label="پخش/توقف"></button>
        <button class="icon" id="mute" aria-label="صدا">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a6.8 6.8 0 0 1 0 13.4v2.1a8.8 8.8 0 0 0 0-17.6z"/></svg>
        </button>
        <span class="timebox"><span id="time">00:00</span> / 02:15</span>
      </div>

      <div class="chapters" id="chapters"></div>

      <div class="brandline"><i></i> Z-NOX</div>
    </div>

    <div class="meta">
      <span id="chapNow">۰۱ — سرآغاز</span>
      <span>مسیریابی: <span class="kbd">Space</span> پخش · <span class="kbd">←</span> <span class="kbd">→</span> پرش · <span class="kbd">F</span> تمام‌صفحه</span>
    </div>
  </div>
</div>

<script src="src/util.js"></script>
<script src="src/copy.js"></script>
<script src="src/brand.js"></script>
<script src="src/nox-path.js"></script>
<script src="src/mark.js"></script>
<script src="src/logo.js"></script>
<script src="src/draw.js"></script>
<script src="src/scenes.js"></script>
<script src="src/main.js"></script>
<script>
/* chapter buttons built after SCENES exist */
(function () {
  const host = document.getElementById('chapters');
  SCENES.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'chap';
    b.dataset.i = i;
    b.dataset.t = s.start;
    b.innerHTML = `<span style="font-family:Inter;opacity:.6">${String(i + 1).padStart(2, '0')}</span> ${s.fa}`;
    b.onclick = () => { window.__jump && window.__jump(s.start); };
    host.appendChild(b);
  });
  const total = FILM.duration;
  document.querySelector('.timebox').innerHTML =
    `<span id="time">00:00</span> / ${String(Math.floor(total / 60)).padStart(2, '0')}:${String(Math.floor(total % 60)).padStart(2, '0')}`;
  document.getElementById('startBtn').onclick = () => {
    document.getElementById('overlay').classList.remove('show');
    start();
  };
})();
</script>
</body>
</html>
