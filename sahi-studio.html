s an argument."],lead:"We are an architecture studio working between drawing and building. Each project below begins as a question about how people will actually occupy a space — the form is what remains after that question is answered.",scroll:"Scroll",stats:[{value:"48",label:"Projects built"},{value:"11",label:"Years practising"},{value:"6",label:"Awards"}]},manifesto:{label:"Position",lines:["Architecture is not","a shape you choose.","It is what is left","once the constraints","have been answered honestly."],body:["We start every project on trace paper, not in a modelling program. The first weeks are spent drawing the site as it behaves — where the light falls in February, which corner the wind cuts across, where people already walk without being told to.","Only when those forces are understood does a form appear. That is why our buildings tend to look inevitable rather than invented: the geometry is a record of the reasoning, not a style applied over it."]},work:{label:"Selected Work",heading:["Eleven years,","forty-eight buildings."],lead:"A selection where the drawing explains the building better than a photograph could.",viewProject:"Open project",fields:{location:"Location",year:"Year",type:"Programme",area:"Area",status:"Status"},items:[{index:"01",title:"Courtyard House",subtitle:"A house turned inward, so the city stays outside",location:"Niavaran, Tehran",year:"2023",type:"Private residence",area:"420 m²",status:"Built",thesis:"The site faced a six-lane road on its only open side. Rather than fight the noise with glass and mass, we removed the centre of the plan and let the house look at itself.",moves:["A void carved from the middle of the volume brings north light into rooms that have no exterior wall.","Circulation wraps the courtyard, so every journey through the house is a lap around the garden.","The street facade is a solid brick screen, perforated only where privacy allows."],detail:"The courtyard is 8 × 8 m — small enough to feel like a room, large enough that the mulberry tree at its centre will still have room in thirty years. Every internal window looks across it, which means the house is never dark and never overlooked."},{index:"02",title:"Stone Library",subtitle:"A reading room that gets its light from above",location:"Kashan",year:"2022",type:"Civic · Library",area:"1 850 m²",status:"Built",thesis:"Books hate direct sun and readers need it. The section resolves the contradiction: light enters high, crosses the ceiling vault, and reaches the desks already softened.",moves:["A north-facing clerestory runs the full length of the roof, washing the vault rather than the shelves.","Stacks sit in the thick, cool perimeter wall; reading tables occupy the bright centre.","Local stone, 600 mm thick, keeps the interior 9 °C below the summer peak without mechanical cooling."],detail:"We built three 1:1 mock-ups of the clerestory on site before committing. The final geometry was set by watching where the light actually landed at 11:00 in July, not by a simulation."},{index:"03",title:"Terraced Offices",subtitle:"Twelve floors that each get a garden",location:"Vanak, Tehran",year:"2024",type:"Commercial",area:"9 400 m²",status:"Completing",thesis:"A tower on a tight urban site usually trades outdoor space for floor area. Stepping the mass back on the south face bought a terrace for every floor and cut solar gain at the same time.",moves:["Each plate is set back 1.8 m from the one below, forming a continuous cascade of planted terraces.","The step depth is exactly the shadow length needed to shade the floor beneath it at midday.","The north face stays flush, keeping the structural core efficient and the plan rectangular."],detail:"The setback is not a gesture. It removes 34% of the peak cooling load, which paid for the terraces twice over across the building's first decade."},{index:"04",title:"Desert Pavilion",subtitle:"Shade as the entire building",location:"Yazd Province",year:"2021",type:"Cultural · Pavilion",area:"260 m²",status:"Built",thesis:"In 46 °C heat, the useful architecture is not the enclosure — it is the shadow. So we built the shadow first and treated the enclosed rooms as an afterthought beneath it.",moves:["A deep timber lattice roof floats above the plan, sized so no direct sun reaches the floor between 09:00 and 17:00.","The gap between roof and rooms works as a wind scoop, pulling air across a shallow water channel.","Enclosed space is kept to 40% of the footprint; the rest is shaded ground."],detail:"Measured on site in August: 46 °C in the open, 31 °C under the lattice, with no energy input at all. The lattice is the building."}]},process:{label:"Process",heading:["How a question","becomes a building."],lead:"Four stages. Nothing is drawn in three dimensions until the reasoning holds in two.",steps:[{number:"01",name:"Reading the site",duration:"Weeks 1 – 3",text:"We survey what is already happening: sun angles across the year, prevailing wind, noise, the paths people have already worn into the ground. This becomes a drawing before it becomes a brief."},{number:"02",name:"The move",duration:"Weeks 3 – 8",text:"One clear spatial idea, tested in section. If it cannot be explained in a single sketch and a sentence, it is not the idea yet — so we keep drawing until it can be."},{number:"03",name:"Resolution",duration:"Months 3 – 9",text:"Plans, sections and details at 1:50 and 1:5. Materials are chosen for how they will look in fifteen years, and mocked up at full size before they are specified."},{number:"04",name:"On site",duration:"Through completion",text:"We stay through construction. Drawings change on site because sites tell you things that surveys do not, and someone from the studio is there every week to hear it."}]},studio:{label:"Studio",heading:["Nine people,","one drawing board."],body:["Sahi Studio was founded in Tehran in 2014. We are deliberately small: nine architects, one office, no branch practices. Every project is drawn by the person who will see it built.","We work across Iran and, increasingly, with clients abroad who want a building rooted in a specific climate rather than an imported one."],credentials:[{value:"2014",label:"Founded"},{value:"9",label:"Architects"},{value:"48",label:"Built projects"},{value:"6",label:"Awards"}],awardsLabel:"Recognition",awards:[{year:"2024",name:"Memar Award — Residential",detail:"Courtyard House"},{year:"2023",name:"Aga Khan Nomination",detail:"Stone Library"},{year:"2022",name:"Iran Concrete Institute — Civic",detail:"Stone Library"},{year:"2020",name:"Memar Award — Public Space",detail:"Desert Pavilion"}]},contact:{label:"Contact",heading:["Tell us about","the site."],lead:"Every project starts with a conversation about where it will stand. Send us the address and what you hope will happen there.",name:"Name",namePlaceholder:"Your name",email:"Email",emailPlaceholder:"you@example.com",message:"The project",messagePlaceholder:"Where is the site, and what should it become?",send:"Send enquiry",sending:"Sending…",success:"Thank you — we will write back shortly.",error:"The message did not reach us. Please try again.",directLabel:"Or write directly",studioLabel:"Studio",address:["No. 14, Golestan Alley","Zaferanieh, Tehran","Iran"]},footer:{tagline:"Architecture & Spatial Design",rights:"© 2026 Sahi Studio",credits:"All drawings by the studio",backToTop:"Back to top"},alert:{success:"Sent",failed:"Failed"},loading:"Loading"},Uv={meta:{studio:"استودیو سَهی",short:"سَهی",tagline:"معماری و طراحی فضا",switchLabel:"EN",switchAria:"تغییر زبان به انگلیسی"},nav:{index:"فهرست",work:"پروژه‌ها",process:"فرآیند",studio:"استودیو",contact:"تماس",toggleMenu:"باز و بسته کردن منو"},hero:{eyebrow:"استودیو معماری · تأسیس ۱۳۹۳ · تهران",lines:["هر خط،","یک استدلال است."],lead:"استودیویی معماری که میان ترسیم و ساخت کار می‌کند. هر پروژه‌ی این مجموعه با پرسشی درباره‌ی نحوه‌ی واقعی سکونت مردم در فضا آغاز شده است؛ فرم، چیزی است که پس از پاسخ به آن پرسش باقی می‌ماند.",scroll:"اسکرول",stats:[{value:"۴۸",label:"پروژه‌ی ساخته‌شده"},{value:"۱۱",label:"سال فعالیت"},{value:"۶",label:"جایزه"}]},manifesto:{label:"موضع",lines:["معماری شکلی نیست","که انتخاب می‌کنید.","چیزی است که می‌ماند","وقتی به محدودیت‌ها","صادقانه پاسخ داده باشید."],body:["هر پروژه را روی کاغذ پوستی آغاز می‌کنیم، نه در نرم‌افزار مدل‌سازی. هفته‌های نخست صرف ترسیم سایت آن‌گونه که رفتار می‌کند می‌شود: نور بهمن‌ماه کجا می‌افتد، باد از کدام گوشه می‌بُرد، مردم پیش از آنکه کسی بگوید از کجا عبور می‌کنند.","تنها پس از درک این نیروهاست که فرمی پدیدار می‌شود. به همین دلیل ساختمان‌های ما بیش از آنکه ابداع‌شده به نظر برسند، اجتناب‌ناپذیر می‌آیند: هندسه، ثبت استدلال است، نه سبکی که رویش نشسته باشد."]},work:{label:"پروژه‌های منتخب",heading:["یازده سال،","چهل‌وهشت ساختمان."],lead:"گزیده‌ای از پروژه‌هایی که نقشه، بهتر از عکس، ساختمان را توضیح می‌دهد.",viewProject:"مشاهده پروژه",fields:{location:"موقعیت",year:"سال",type:"کاربری",area:"مساحت",status:"وضعیت"},items:[{index:"۰۱",title:"خانه‌ی حیاط‌دار",subtitle:"خانه‌ای رو به درون، تا شهر بیرون بماند",location:"نیاوران، تهران",year:"۱۴۰۲",type:"مسکونی خصوصی",area:"۴۲۰ مترمربع",status:"ساخته‌شده",thesis:"تنها جبهه‌ی باز زمین رو به بزرگراهی شش‌بانده بود. به‌جای مقابله با صدا از طریق شیشه و جرم، مرکز پلان را برداشتیم و گذاشتیم خانه به خودش نگاه کند.",moves:["حیاطی که از میانه‌ی حجم کنده شده، نور شمالی را به اتاق‌هایی می‌رساند که هیچ دیوار بیرونی ندارند.","گردش، حیاط را دور می‌زند؛ پس هر مسیری در خانه، دوری است گرد باغ.","نمای خیابان صفحه‌ای آجری و توپر است که تنها آنجا که حریم اجازه می‌دهد مشبک می‌شود."],detail:"حیاط ۸ در ۸ متر است — آنقدر کوچک که حس اتاق بدهد و آنقدر بزرگ که درخت توت میانش سی سال دیگر هم جا داشته باشد. هر پنجره‌ی داخلی به آن می‌نگرد؛ یعنی خانه هرگز تاریک نیست و هرگز در معرض دید نیست."},{index:"۰۲",title:"کتابخانه‌ی سنگی",subtitle:"تالار مطالعه‌ای که نورش را از بالا می‌گیرد",location:"کاشان",year:"۱۴۰۱",type:"عمومی · کتابخانه",area:"۱٬۸۵۰ مترمربع",status:"ساخته‌شده",thesis:"کتاب از آفتاب مستقیم بیزار است و خواننده به آن نیاز دارد. مقطع این تناقض را حل می‌کند: نور از بالا وارد می‌شود، از روی طاق می‌گذرد و نرم‌شده به میزها می‌رسد.",moves:["نورگیری شمالی در تمام طول بام امتداد دارد و به‌جای قفسه‌ها، طاق را می‌شوید.","قفسه‌ها در دیوار ضخیم و خنک پیرامونی می‌نشینند؛ میزهای مطالعه مرکز روشن را اشغال می‌کنند.","سنگ محلی به ضخامت ۶۰۰ میلی‌متر، دمای داخل را بدون سرمایش مکانیکی ۹ درجه پایین‌تر از اوج تابستان نگه می‌دارد."],detail:"پیش از تصمیم نهایی، سه ماکت ۱:۱ از نورگیر را در سایت ساختیم. هندسه‌ی نهایی با تماشای جای واقعی افتادن نور در ساعت ۱۱ صبح تیرماه تعیین شد، نه با شبیه‌سازی."},{index:"۰۳",title:"اداری پلکانی",subtitle:"دوازده طبقه که هرکدام باغ خود را دارند",location:"ونک، تهران",year:"۱۴۰۳",type:"تجاری",area:"۹٬۴۰۰ مترمربع",status:"در حال تکمیل",thesis:"برجی در زمینی تنگ معمولاً فضای باز را فدای زیربنا می‌کند. عقب‌نشینی پلکانی جبهه‌ی جنوبی، برای هر طبقه تراسی خرید و هم‌زمان بار حرارتی را کاهش داد.",moves:["هر صفحه ۱٫۸ متر از صفحه‌ی زیرین عقب می‌نشیند و آبشاری پیوسته از تراس‌های کاشته‌شده می‌سازد.","عمق پله دقیقاً برابر طول سایه‌ای است که برای سایه‌اندازی بر طبقه‌ی زیرین در ظهر لازم است.","جبهه‌ی شمالی صاف می‌ماند تا هسته‌ی سازه‌ای کارآمد و پلان مستطیل بماند."],detail:"عقب‌نشینی یک ژست نیست. ۳۴٪ از اوج بار سرمایشی را حذف می‌کند و همین، در دهه‌ی نخست عمر ساختمان، دو بار هزینه‌ی تراس‌ها را بازگردانده است."},{index:"۰۴",title:"کوشک کویری",subtitle:"سایه، به‌مثابه‌ی تمامِ ساختمان",location:"استان یزد",year:"۱۴۰۰",type:"فرهنگی · کوشک",area:"۲۶۰ مترمربع",status:"ساخته‌شده",thesis:"در گرمای ۴۶ درجه، معماریِ به‌کار، پوسته نیست — سایه است. پس نخست سایه را ساختیم و اتاق‌های بسته را همچون پیوستی زیر آن در نظر گرفتیم.",moves:["بامی مشبک و عمیق از چوب بر فراز پلان شناور است، چنان ابعادی که میان ۹ صبح تا ۵ عصر هیچ آفتاب مستقیمی به کف نرسد.","فاصله‌ی میان بام و اتاق‌ها همچون بادگیر عمل می‌کند و هوا را از روی جوی کم‌عمق آب می‌کشد.","فضای بسته تنها ۴۰٪ سطح اشغال است؛ باقی، زمینِ سایه‌دار."],detail:"اندازه‌گیری مردادماه در سایت: ۴۶ درجه در فضای باز، ۳۱ درجه زیر مشبک — بدون هیچ مصرف انرژی. مشبک، خودِ ساختمان است."}]},proce
